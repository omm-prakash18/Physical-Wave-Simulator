version: '3.8'

services:
  latent-video-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: latent-video-studio:latest
    container_name: latent_video_prediction_studio
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
